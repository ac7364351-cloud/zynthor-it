<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/z-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141619" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("zynthor_theme");
          if (saved === "light") {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("light");
          } else {
            document.documentElement.classList.add("dark");
            document.documentElement.classList.remove("light");
          }
        } catch (e) {}
      })();
      if (typeof window !== "undefined" && "scrollRestoration" in window.history) {
        window.history.scrollRestoration = "manual";
      }
    </script>
    <title>Zynthor IT — Software Engineering, Web Applications & Zynthor Business OS</title>
    <meta
      name="description"
      content="Zynthor IT is a software development and technology company offering modern website development, bespoke web applications, and our flagship SaaS product, Zynthor Business OS."
    />
    <meta name="keywords" content="Zynthor IT, Zynthor Business OS, SaaS, CRM, QR Menu, Salon Booking, Web Development, Software Engineering" />
    <meta property="og:title" content="Zynthor IT — Software Engineering & Zynthor Business OS" />
    <meta
      property="og:description"
      content="Modern website development, custom software engineering, and Zynthor Business OS — the all-in-one multi-tenant operating system for growing businesses."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/screenshots/02-dashboard-dark.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zynthor IT — Software Engineering & Zynthor Business OS" />
    <meta name="twitter:description" content="Modern website engineering, bespoke digital applications, and our flagship multi-tenant SaaS platform, Zynthor Business OS." />

            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+91-98000-00000",

            }

        ]

  </head>

  </body>
</html>
