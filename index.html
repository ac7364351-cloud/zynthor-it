<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/z-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("zynthor_theme");
          if (saved === "light") {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("light");
          } else {
            document.documentElement.classList.add("dark");
            document.documentElement.classList.remove("light");
          }
        } catch (e) {}
      })();
      if (typeof window !== "undefined" && "scrollRestoration" in window.history) {
        window.history.scrollRestoration = "manual";
      }
    </script>
    <title>Zynthor Business OS — Premium Autonomous SaaS for Salons, Cafes & Enterprises</title>
    <meta
      name="description"
      content="Zynthor Business OS is the next-generation operating system empowering luxury salons, gourmet bistros, and service businesses with automated scheduling, CRM, digital QR menus, and bilingual AI copilots."
    />
    <meta property="og:title" content="Zynthor Business OS — Luxury Business Operating System" />
    <meta
      property="og:description"
      content="Unified CRM, salon appointments with conflict protection, cafe KDS & QR menus, and bilingual AI automation in Obsidian Luxury design."
    />
    <meta property="og:type" content="website" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
